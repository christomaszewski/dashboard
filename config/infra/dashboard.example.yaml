# Dashboard instance config. rig cross-checks `service`/`name` against vehicle.yaml; dash-up reads
# the flat keys (tools/dash_env.py) to parameterize the compose stack, and bind-mounts THIS file
# into dashboard-web so the app itself can read `ws_port` and the `home:` layout at page load
# (served at /config/dashboard.yaml; edit + `docker compose restart dashboard-web` + refresh).
# Copy/edit per deployment.
service: dashboard
name: dashboard       # instance name -> compose project (rig requires it unique across the vehicle)
web_port: 8080        # http: the React bundle        -> http://<vehicle-ip>:<web_port>
ws_port: 10000        # remote-api websocket (zenoh-ts) -> ws://<vehicle-ip>:<ws_port>

# local_bridge: ws/127.0.0.1:10000  # default: prefer a verified bridge ON THE LAPTOP, then vehicle
# local_bridge: false              # disable laptop discovery; always use vehicle ws_port
# See docs/LOCAL_BRIDGE.md for laptop setup and browser HTTPS/local-network permission requirements.

# rmw_attachment: plain   # the rmw_zenoh attachment layout this page SENDS on service calls:
                          #   plain = rmw_zenoh 0.10 (ROS 2 Lyrical, the fleet's; default),
                          #   labelled = rmw_zenoh 0.2 (Jazzy). MUST match the vehicle's nodes: a
                          #   server given the other layout crashes. Bus debug's attachment column
                          #   names the layout live samples carry — check it before the first call.

# clouds_dir: /data/clouds   # optional: host dir of point-cloud files (.bpf, .las) served read-only
                             #   at /clouds/ for the Clouds tab (relative paths resolve against this
                             #   config's directory). Omit -> the tab still works via drag & drop, and
                             #   via Runs…: any cloud file in any rig run directory, whenever the run
                             #   registry is served at /rig-data/ (rig's RIG_DATA_DIR, or rig_data_dir).

# ── Topic rate limits (optional) — the wireless link ───────────────────────────────────────────
# Every subscribed ROS topic crosses the browser's ONE WebSocket sample by sample at the publisher's
# rate; on a spotty link that volume queues behind TCP retransmits and reaches the page late. Cap it
# BEFORE the air: dash-up renders these into the sidecar's zenoh config as downsampling rules on its
# ingress from the router (tools/dash_zenoh_config.py). Generic readouts coalesce at 5 Hz; health
# diagnostics and 3D use their own ingestion paths. Scoped to
# the ROS domain, so lifecycle/playback/rig state and every service call stay untouched; `put`
# messages only. Rate widgets (`topic_hz`) read the capped rate — set their min_hz accordingly.
# These rules apply to the vehicle sidecar path. A laptop bridge connected directly to the router
# bypasses them; native-link rate limits must run on the vehicle before the wireless hop.
# Leave DiagnosticArray topics uncapped: many publishers can share /diagnostics, so downsampling
# can discard another service's status or a brief fault. Prefer topic_rates on high-volume data
# instead of topic_rate_hz when health reporting is enabled. Native fleet health is not capped.
#
# topic_rate_hz: 5        # every topic of the domain at most 5 Hz to the browser
# topic_rates:            # OR explicit per-topic caps (needs PyYAML on the host); never both — zenoh
#   /imu/data: 10         #   applies the first matching rule, so a global cap can't be layered under
#   /ouster/points: 1     #   per-topic ones
# ros_domain_id: 1        # scopes the rules (default: rig's ROS_DOMAIN_ID, exported to every launcher)

# ── Rig agent (optional) ───────────────────────────────────────────────────────────────────────
# `rig_agent: true` makes dash-up start a third service, dashboard-rig-agent (docs/RIG_AGENT.md):
# the deployment's rows with live compose/health/operational state, the open run with new-run /
# end-run, standby/activate/up/down per row (as jobs), and the run registry browser — all on the
# Rig tab (shown automatically) and in `type: rig` home widgets. OPT-IN ON PURPOSE: the agent holds
# the vehicle's docker socket (root-equivalent) and drives `rig` for the whole deployment; the mesh
# is the trust boundary (deploy/README.md). dash-up finds the deployment tree by walking up from
# this file to the nearest vehicle.yaml and takes data_dir from rig's RIG_DATA_DIR; override below.
#
# rig_agent: true
# rig_root: /home/uxv/ws/test1     # the deployment tree (default: nearest vehicle.yaml above this file)
# rig_data_dir: /home/uxv/logs     # the run registry (default: rig's RIG_DATA_DIR); mounted read-only
#                                  #   into dashboard-web at /rig-data/ for the run browser + downloads
# rig_mount: /home/uxv/ws          # a WIDER read-only mount when the catalog points at ../sibling
#                                  #   checkouts (dev workspaces); default: rig_root
rig_actuate: false                 # read-only agent: no verbs, no buttons (state + runs still shown).
#                                  #   Flip to true only when operators may drive the deployment from
#                                  #   the dashboard; recording itself is controlled elsewhere (the
#                                  #   lifecycle strips, the bag_recorders widget)
# rig_poll_s: 10                   # `rig status` cadence

# ── Tabs (optional) ────────────────────────────────────────────────────────────────────────────
# Tabs beyond Home are OPT-IN: list the ones this deployment uses and the rest never appear (nor do
# you need to know they exist). With no `tabs:` at all the app is Home alone, tab bar hidden.
# Available: health, cameras, ros, ros3d, rig, clouds, debug (+ home, on unless switched off). `rig_agent: true`
# implies `rig` (that tab is the agent's UI); an explicit `tabs.rig` always wins. The Clouds tab is
# lazy-loaded (its three.js chunk only downloads when opened). A deep link to a tab that is not
# listed falls back to the first visible tab.
#
# tabs: [health, cameras, ros, ros3d, rig, clouds, debug] # list form: these, plus Home
#
# tabs:                           # the map form: the only way to say `false`
#   health: true      # dedicated sensor/service overview, component details and recent events
#   cameras: true
#   ros: true
#   ros3d: true
#   clouds: true
#   debug: true
#   rig: false        # hide the Rig tab despite rig_agent (its home widgets still work)
#   home: false       # Home off too (the first listed tab becomes the landing page)

# ── Shared health discovery (optional; docs/SERVICE_HEALTH.md) ─────────────────────────────────
# Home health widgets, the Health tab, and the Cameras health card share one native/ROS store.
# Native JSON is discovered at fleet/*/svc/*/health. ROS services such as Ouster publish
# diagnostic_msgs/msg/DiagnosticArray, discovered by type on the existing Zenoh graph.
# ROS traffic must reach this router via rmw_zenoh or a compatible bridge; the dashboard does
# not poll sensor HTTP APIs. Ordinary ROS diagnostics work without fleet metadata.
# Defaults: all DiagnosticArray topics except */diagnostics_agg, all visible domains, 15 s
# fallback expiry for unannotated diagnostics. Publisher freshness metadata takes precedence.
# Lists are exact allowlists, not globs; [] disables that ROS selection (native stays).
#
# health:
#   ros_topics: [/diagnostics]   # example allowlist; omit for discovery by type
#   ros_domains: [0]            # example allowlist; omit for all graph domains
#   ros_stale_after_s: 15       # positive finite seconds; fallback only
#
# To consume an aggregator instead, set ros_topics: [/diagnostics_agg]. Avoid consuming raw and
# aggregated versions of the same statuses together unless that duplication is intentional.
# Enable the Health tab through tabs above; a Home health widget does not require the tab.
#
# ── ROS PointCloud2 / TF visualization (optional; docs/ROS_3D.md) ─────────────────────────────────
# Defaults below apply to the ROS 3D tab AND Home pointcloud widgets. A widget can override ANY
# of these keys directly on its own mapping; displays replaces the whole list (no list merge).
# The viewer never starts bag playback. time_source: ros_clock follows an external /clock.
#
# ros3d:
#   # domain_id: 0              # omit = sole visible domain; ambiguous domains need a choice
#   fixed_frame: ""             # default empty: choose a TF frame in the UI; e.g. map or odom
#   tf_topics: [/tf]             # up to 16 names; [] disables dynamic TF subscriptions
#   tf_static_topics: [/tf_static] # up to 16 names; [] disables static TF subscriptions
#   time_source: live            # live | ros_clock
#   clock_topic: /clock          # one clock publisher in the selected domain for ros_clock
#   follow_frame: ""             # empty = free camera; e.g. base_link to follow the vehicle
#   show_frames: false           # TF frame axes
#   show_grid: true
#   max_points: 2000000          # retained scene points; integer 1..5000000
#   max_cloud_points: 500000     # sampled points per cloud; integer 1..2000000
#   max_memory_mb: 128           # retained data budget; integer 8..256 (shared app limits still apply)
#   tf_history_s: 10             # dynamic TF retention; integer 1..120 seconds
#   tf_wait_ms: 500              # live wait for a missing transform; integer 50..10000 ms
#   playback_service: ""         # optional adapter/player base binding, e.g. /ros3d_replay
#   playback_state_topic: /ros3d/replay_state # adapter snapshots; "" disables discovery
#   displays:                    # up to 16 layers; [] starts empty; unique IDs
#     - id: ouster               # default = topic when omitted
#       topic: /ouster/points    # PointCloud2; use the actual namespace/topic on your vehicle
#       enabled: true
#       color:
#         mode: height          # height | intensity | field | rgb | flat
#         # field: reflectivity # required with mode: field; a numeric PointCloud2 field name
#         # value: "#38bdf8"     # optional with mode: flat; must be #rrggbb
#       point_size: 2           # pixels, 1..20
#       opacity: 1              # 0..1
#       history_s: 0            # scan history, 0..300 s; 0 = latest scan only
#
# Sampling bounds browser work, not network traffic. See topic_rates above for link limits.
# Native bag playback may need to resume after a paused seek before TF/clouds are available.
# The optional ros3d_replay adapter publishes snapshots for immediate paused previews.
#
# ── Home tab (optional) ────────────────────────────────────────────────────────────────────────
# Lays out the project-specific Home: status pills, ROS2 service buttons, live video, topic
# readouts, grouped panels. Omit the whole block for the built-in default Home (connection +
# discovery summary). One malformed widget shows an inline error card and the rest still render.
# Optional keys are commented; examples are illustrative, with defaults noted where relevant.
# All widgets accept area (a named layout region) and span (1 | 2 | full); area wins over span.
# Labels scope remembered choices; use distinct labels for independent widgets.
# Numeric threshold options: warn_below, warn_above, err_below, err_above (strict < / >).
# They are optional; errors win over warnings. No thresholds are inferred when omitted.
#
# home:
#   version: 1                 # schema major; unsupported -> banner + default Home
#   title: Mission Overview    # optional; also shown next to the topbar brand
#
#   # -- layout (optional): place widgets on a named 2-D grid --------------------------------------
#   # Draw the page as rows of area names ('.' = empty cell); each name must form a solid
#   # rectangle. Widgets pick a cell block with `area:`; widgets WITHOUT an area auto-flow into the
#   # remaining cells (their `span:` still applies; `span` is ignored when `area` is set). An
#   # invalid layout or unknown/duplicate area degrades to auto-flow with a warning banner — never
#   # a broken page. Narrow screens (<560px) collapse to one column. Omit `layout:` entirely for
#   # the flow-order grid.
#   layout:
#     columns: "2fr 1fr 1fr"   # optional grid-template-columns tracks (default: equal columns)
#     areas:
#       - "cams cams power"
#       - "cams cams nav"
#       - "ctrl ctrl  nav"
#
#   widgets:
#
#     # -- status: presence / rate indicator ----------------------------------------------------
#     - type: status
#       label: Front camera
#       source: stream         # stream | node | topic_hz
#       stream: cam0           # sensor id (last segment of fleet/*/media/<id>), descriptor id,
#                              #   or the full keyexpr
#
#     - type: status
#       label: Nav node
#       source: node
#       node: /navsat_transform    # fully-qualified node name (namespace included)
#
#     - type: status
#       label: IMU rate
#       source: topic_hz       # measured arrival rate on the topic's rmw_zenoh data keyexpr.
#       topic: /imu/data       #   NB: holds a live data subscription — the payload streams to the
#       min_hz: 90             #   browser. Prefer low-rate topics or accept the bandwidth.
#       # window_s: 5          # measurement window (default 5 s)
#
#     # -- service_button: call a ROS2 service over zenoh ---------------------------------------
#     # Type resolution is automatic: bundled schemas (std_srvs Trigger/SetBool/Empty, ...) or the
#     # serving node's ~/get_type_description for anything else — vendor types included.
#     - type: service_button
#       label: Start recording
#       service: /recorder/start
#       # srv_type: std_srvs/srv/Trigger   # optional cross-check against the live graph only
#       # request: {}          # request fields; omitted fields zero-fill
#       # confirm: false       # true = two-step click for destructive actions
#       # timeout_s: 5
#
#     # -- services: several services — server status, a request form, call, the response --------
#     # Rows are `services:` entries: a name, or a mapping. The request FORM comes from the live
#     # type (bundled, or the serving node's ~/get_type_description): bools, numbers and strings as
#     # inputs, arrays / nested messages as JSON; `request:` pre-fills it, `reset fields` restores
#     # it. The response (or the error) stays on the row until the next call. `service_button`
#     # above stays the one-click, fixed-request form.
#     - type: services
#       label: Recorder
#       services:
#         - /bag_logger/rosbag2_recorder/pause            # no request fields: just the button
#         - service: /bag_logger/rosbag2_recorder/resume
#           label: Resume
#           request: { resume_mode: 0 }                   # form defaults (omitted fields zero-fill)
#           # confirm: true        # two-step click
#           # timeout_s: 5
#           # srv_type: rosbag2_interfaces/srv/Resume    # optional cross-check against the graph
#       # span: 2
#
#     # -- camera: a tile you DRIVE (the video chrome + overlaid record / playback controls) ------
#     # `stream` is a DEFAULT: the tile's picker changes it at runtime and the choice is remembered
#     # per widget (label it!). Omit `stream` to pick from discovery — the only stream auto-selects,
#     # several offer the picker in the tile's place. `lock: true` pins the config, picker gone.
#     - type: camera
#       label: Front camera
#       stream: cam0
#       # lock: true           # operator deployments: this stream and only it
#       # controls: auto       # auto | record | playback | none
#       # confirm: true        # two-step click before a recording transition
#       # run_id: survey       # sent with activate -> recording run prefix suffix
#       # span: 2
#
#     # -- cameras: several feeds in one widget ------------------------------------------------
#     # `focus` = one large feed with the rest as live thumbnails in a carousel (click one to bring
#     # it up, ←/→ cycle, Esc / ⊞ to the grid); `grid` = all tiled. The set is `streams:` or, when
#     # omitted, every discovered stream; the picker adds feeds and a tile's ✕ removes one unless
#     # `lock`. Layout, focus and the set are remembered per widget. Every feed is a WebRTC session
#     # AND a vehicle-side encode (shared with other tiles of that stream, not free): six thumbnails
#     # are six encodes on the vehicle.
#     - type: cameras
#       label: Cameras
#       # streams: [cam0, cam1, thermal]   # omit = every discovered stream
#       # layout: focus        # focus | grid
#       # focus: cam1          # the feed in focus at first (default: the first)
#       # columns: 2           # grid only (default: as many as fit)
#       # lock: true           # exactly `streams`: no picker, no ✕
#       # controls: auto       # auto | record | playback | none, on every tile
#       # confirm: false       # two-step confirmation when true
#       # run_id: survey       # recording run prefix suffix sent with activate
#       # span: full           # (cameras default full)
#
#     # -- bag_recorders: every rosbag2 recorder on the graph, its WRITING controlled here ------
#     # Recorders are found by their own services (a node serving .../pause AND .../is_paused:
#     # rosbag2's recorder, one per bag_logger namespace) and driven through them: pause / resume
#     # the writing of the open session, split the bag file, take a snapshot (snapshot-mode
#     # recorders). State is polled from .../is_paused. NOT session control: a bag session is a
#     # rig run's, and where a run starts and ends stays rig's call from the vehicle.
#     - type: bag_recorders
#       label: Bag recorders
#       # recorders: [/bag_logger/rosbag2_recorder]   # omit = every recorder discovered
#       # actions: [pause, resume, split]   # from pause | resume | split | snapshot
#       # poll_s: 3            # is_paused polling period (seconds)
#       # confirm: true        # two-step click before pause / split / snapshot
#       # span: 2
#
#     # -- video: embedded live stream ----------------------------------------------------------
#     # Shares ONE WebRTC session (and one vehicle-side encode) with the Cameras tab.
#     - type: video
#       stream: cam0
#       area: cams             # optional: a layout.areas name (any widget type accepts area:)
#       # label:               # overlay label (default: the stream's role/id)
#       # span: 2              # grid cells when auto-flowing: 1 | 2 | full (video default 2)
#
#     # -- panel: grouped mini-widgets in one card ----------------------------------------------
#     # Items are readout shorthands (a `field:` with no `type:` — shown as name | value rows,
#     # inheriting the panel `topic:`) and/or compact widgets: status, service_button, topic_value,
#     # lifecycle, health, rig, gauge, sparkline, indicator, text, and the shipped example_compass
#     # extension. Other types and nested panels are not panel-capable. A bad item is one red row;
#     # siblings render.
#     # NB: a full `type: topic_value` item does NOT inherit the panel topic — only shorthands do.
#     # All topic rows on one topic share a single bus subscription + decode.
#     - type: panel
#       title: GNSS            # optional header
#       area: nav
#       topic: /gnss/fix       # default topic for the readout shorthands below
#       items:
#         - field: latitude    # dot-path into the decoded message
#           name: Lat          # row label (default: the field path); `label:` also accepted
#           precision: 6
#         - name: Fix          # OR a format line: several values of ONE message on one row —
#           format: "lat {latitude:.6f}  lon {longitude:.6f}  alt {altitude:.1f} m"
#                              #   {field} / {field:.Nf} placeholders, {{ }} literal braces; units
#                              #   and decimals live in the string; a missing field shows `?`
#         - field: status.satellites_used
#           name: Sats
#         - field: voltage
#           topic: /battery_state   # per-item topic override
#           name: Battery
#           unit: V
#           warn_below: 22.0
#         - type: status
#           label: Nav node
#           source: node
#           node: /navsat_transform
#         - type: service_button
#           label: Re-init
#           service: /gnss/reset
#
#     # -- lifecycle: standby/active control of a service (camera-service recording) --------------
#     # Drives the zenoh lifecycle control plane (camera-service docs/LIFECYCLE.md):
#     #   fleet/<vehicle>/svc/<instance>/lifecycle{,/change_state,/state}. Shows the live state,
#     # the current recording run + health, and one button per transition the service accepts
#     # right now. The Cameras tab also lists every advertised service with no config at all.
#     # Also allowed as a panel item (compact row).
#     - type: lifecycle
#       label: Front cam recorder
#       service: cam0            # <instance> (the CAM_INSTANCE segment) or <vehicle>/<instance>
#       # confirm: true          # two-step click before a transition
#       # run_id: survey         # sent with activate -> recording run prefix suffix
#
#     # -- health: persistent sensor/service overview ------------------------------------------
#     # Native JSON and standard ROS diagnostics use the shared health: discovery above.
#     # Each reporter gets a verdict, available temp.<where>_c and supply.power_w readings, and
#     # severity-colored issue pills. Hover/focus/tap opens messages, vendor codes, hardware,
#     # source, sample age and voltage/current. Narrow cards show trends in these details;
#     # wider cards also show inline trends. Offline/stale readings stay labeled last known.
#     # The picker switches between all reporters (including future arrivals) and a manual set
#     # saved in this browser. It filters only this widget, not the shared store or Health tab.
#     # Configured/remembered reporters not yet seen get placeholders. Generic ROS reporters
#     # can be selected in the picker even without fleet identity metadata.
#     # Also allowed inside a panel with the same compact overview.
#     - type: health
#       label: Sensor health
#       # services: [vehicle/cam_front, vehicle/top] # omit = discover all; [] = initially none
#       #                        # instance alone also accepted; qualify for multiple vehicles
#       # lock: false            # true = hide picker, ignore browser choices, enforce YAML
#       # components: [camera, temperature, power, stream, sensor alerts] # omit/[] = all
#       #                        # exact component names, including alert/<vendor code>;
#       #                        # filters verdict too (can hide excluded component faults)
#       # details: false         # true = initially expand all components and their values
#       # history_s: 300         # 0..600 seconds; 0 disables trends; bounded session history
#       # precision: 1           # measurement decimals; integer 0..6
#       # warn_above: 60         # illustrative TEMPERATURE-only display thresholds (degrees C)
#       # err_above: 70          # do not affect watts, producer levels or recorded diagnostics
#       # warn_below: 0          # choose sensor-specific limits; none enabled by default
#       # err_below: -10
#       # span: 1
#     # Changing YAML services starts a fresh preference scope; distinct labels keep widgets
#     # independent. Set operational limits in the producer's health.limits when they must
#     # affect diagnostics/recording (producer uses error_above/error_below, not err_*).
#
#     # -- rig: the deployment at a glance (needs rig_agent: true) --------------------------------
#     # The open run (label · age, New run / End run) and one row per vehicle.yaml entry with its
#     # state pill and buttons: the zenoh lifecycle transitions when the instance advertises one
#     # (camera-service), else rig's standby/activate for services declaring the trio, plus
#     # compose up/down. Verbs run as jobs on the vehicle (progress on the Rig tab). Also allowed
#     # as a panel item (one compact row: run · n/m running).
#     - type: rig
#       label: Deployment
#       # stacks: [cam_front, lidar]   # only these rows (default: every enabled row)
#       # actions: true          # per-row buttons
#       # runs: true             # New run / End run controls — OPT-IN (default false: where a run
#       #                        #   starts and ends stays rig's call from the vehicle)
#       # confirm: true          # two-step click before any verb
#       # use_run_label: true    # lifecycle activate carries the open run's label as run_id
#       # span: 2                # (rig default 2)
#
#     # -- map: live vehicle position -----------------------------------------------------------
#     # Marker + breadcrumb trail from a NavSatFix-style topic. TILES ARE FETCHED BY THE VIEWING
#     # BROWSER, never the vehicle: the OSM default just works on an internet-connected operator
#     # PC; a fully-offline operator PC can serve its own z/x/y tile tree (e.g. `python3 -m
#     # http.server 8000` in the tiles dir -> tiles: http://localhost:8000/{z}/{x}/{y}.png); a
#     # vehicle-hosted path works too. Unreachable tiles degrade to a plain background — the
#     # marker and trail always render.
#     - type: map
#       label: Position
#       topic: /gnss/fix
#       basemap: satellite       # initial layer: streets (default), satellite, terrain, none, custom
#                                # the widget's Basemap selector changes it during operation;
#                                # page reload restores this configured default
#       # lat_field: latitude     # dot-paths, for non-NavSatFix position sources
#       # lon_field: longitude
#       # orientation_topic: /imu/data  # optional IMU quaternion; omitted/invalid => dot marker
#       # orientation_field: orientation # dot-path to quaternion, e.g. pose.pose.orientation
#       # orientation_frame: enu     # enu (ROS default) or ned; must be earth-referenced
#       # heading_offset_deg: 0      # clockwise correction; no automatic TF/mount transform
#       # tiles: /tiles/{z}/{x}/{y}.png   # adds a Custom choice; defaults to it if basemap is omitted
#                                       # legacy tiles: "none" still starts with no basemap
#       # zoom: 17               # initial/follow zoom (2..22)
#       # trail: 500             # breadcrumb points kept (0 disables)
#       # follow: true           # keep the vehicle centered; panning pauses, ⌖ resumes
#       # attribution:           # credits for Custom tiles; built-in layers include their credits
#       # span: 2                # (map default 2)
#
#     # Multiple position sources: use feeds INSTEAD OF topic and its per-position options above.
#     # Checkboxes show/hide tracks; Follow selects one (or Focus when follow: false).
#     # Hidden feeds retain their trails. Reload restores config defaults.
#     - type: map
#       label: Position sources
#       basemap: satellite
#       default_feed: fused      # initially visible feed ID; default = first visible feed
#       trail: 500               # points per feed, 0 disables
#       feeds:
#         - id: gnss             # required and unique within this map
#           label: GNSS
#           topic: /gnss/fix
#           color: "#38bdf8"     # optional hex color; otherwise automatic palette
#         - id: fused
#           label: Fused position
#           topic: /localization/fix
#           lat_field: latitude           # per-feed position and heading options
#           lon_field: longitude
#           orientation_topic: /imu/data   # independent optional heading per feed
#           orientation_field: orientation
#           orientation_frame: enu         # enu | ned
#           heading_offset_deg: 0
#           color: "#fbbf24"
#         - id: reference
#           label: Reference
#           topic: /reference/fix
#           visible: false       # operator can turn this on later
#
#     # -- ros_image: raw ROS image preview over Zenoh ------------------------------------------
#     # Separate from WebRTC camera feeds. Supports sensor_msgs/msg/Image mono8/mono16,
#     # 8UC1/16UC1, rgb8/bgr8/rgba8/bgra8; row padding and pixel byte order are respected.
#     # Selects one image topic at a time; pauses its subscription when Home is hidden.
#     # Shared decoding is capped at 5 Hz, but network traffic remains at the publisher rate.
#     - type: ros_image
#       label: Ouster panorama
#       topic: /ouster/nearir_image # initial image; driver proc_mask must include IMG
#       # topics: [/ouster/nearir_image, /ouster/reflec_image, /ouster/signal_image, /ouster/range_image]
#       #                         # picker allowlist including topic; omit = all ROS Image topics
#       # domain_id: 0            # omit = unique matching topic; choose if domains are ambiguous
#       # normalize: true         # per-frame grayscale contrast; off = full 8/16-bit range
#       # stale_after_s: 3         # positive finite seconds; silence labels the retained frame
#       # span: full              # default full; keeps native aspect ratio; not panel-capable
#     # Ouster panoramas are already destaggered by its driver. No calibration/remapping needed.
#     # Rendering limits: 2 megapixels, 16 MiB input, 16384 per dimension. Unsupported encodings
#     # produce a visible error; JPEG/PNG CompressedImage topics need a different decoder.
#
#     # -- pointcloud: compact ROS 3D scene -----------------------------------------------------
#     # Inherits the full ros3d: block above. Every scene key (limits, TF, time, frames,
#     # playback binding and displays) can be set directly here to override that default.
#     # Unique labels keep per-view UI preferences independent. Not panel-capable.
#     - type: pointcloud
#       label: Lidar view
#       # domain_id: 0
#       # fixed_frame: map
#       # time_source: live
#       # displays:
#       #   - {id: top, topic: /ouster/points, color: {mode: intensity}, history_s: 3}
#       # span: full             # default full
#
#     # -- rosbag_playback: central controls for an existing player ------------------------------
#     # Discovers advertised pause/resume/rate/seek capabilities. The snapshot adapter adds
#     # paused previews, Restart and a runtime loop switch. Does not launch a player.
#     - type: rosbag_playback
#       label: Replay controls
#       # domain_id: 0           # omit = sole visible domain (not inherited from ros3d)
#       # service: /ros3d_replay  # player node/service BASE, not /pause; default discovery
#       # state_topic: /ros3d/replay_state # default adapter snapshot topic
#       # span: full             # default full; not panel-capable
#
#     # -- gauge: arc gauge for a numeric field -------------------------------------------------
#     - type: gauge
#       label: Battery
#       topic: /battery_state
#       field: percentage
#       max: 100               # required
#       # min: 0
#       # unit: "%"
#       # precision: 0         # example decimals; omitted = raw numeric formatting
#       # warn_below: 30        # example arc/value thresholds; none by default
#       # err_below: 15
#       # warn_above: 95
#       # err_above: 100
#
#     # -- sparkline: recent history of a numeric field ----------------------------------------
#     - type: sparkline
#       label: Speed
#       topic: /odom
#       field: twist.twist.linear.x
#       # window_s: 60         # history kept
#       # min: 0               # optional lower y bound; omit for autoscale
#       # max: 5               # optional upper y bound; must exceed min when both set
#       # unit: m/s
#       # precision: 1         # example decimals; omitted = raw numeric formatting
#       # warn_above: 4         # example line/value thresholds; none by default
#       # err_above: 5
#       # warn_below: 0
#       # err_below: -1
#
#     # -- indicator: value -> colored state pill via rules ------------------------------------
#     # First rule whose conditions all hold wins (conditions: equals, not_equals, below, above,
#     # between: [lo, hi], in: [..], matches: <regex>); level: ok | warn | err | idle; `text`
#     # replaces the raw value. `default` applies when nothing matches (else idle).
#     - type: indicator
#       label: Armed
#       topic: /mavros/state
#       field: armed
#       rules:
#         - { equals: true,  level: ok,   text: ARMED }
#         - { equals: false, level: idle, text: disarmed }
#       # Other rule shapes (choose conditions for that field; first match wins):
#       #   - {not_equals: false, level: warn, text: UNKNOWN}
#       #   - {below: 10, above: 0, level: warn} # conditions on one rule combine with AND
#       #   - {between: [10, 20], level: ok}   # inclusive bounds
#       #   - {in: [GUIDED, AUTO], level: ok}
#       #   - {matches: "^RTK", level: ok, text: RTK} # regex against the string form
#       # default: { level: warn, text: "?" } # omitted = idle with the raw value
#
#     # -- text: static operator notes ---------------------------------------------------------
#     - type: text
#       label: Radio
#       text: |
#         Ops channel 7. Call the tower before any lift.
#
#     # -- custom widgets: projects can add their own types (React, compiled into the image) ---
#     # See app/src/extensions/README.md. This extension is registered by default; if you remove
#     # its import from app/src/extensions/index.ts, also remove it from your instance config.
#     - type: example_compass
#       label: Heading
#       topic: /imu/heading
#       field: data            # numeric heading; dot-path into the decoded message
#       # units: deg           # deg (default) | rad; also works as a compact panel item
#
#     # -- topic_value: live readout — one field, or a format line ------------------------------
#     - type: topic_value
#       label: Battery
#       topic: /battery_state
#       field: voltage         # dot-path into the decoded message; numeric segments index arrays
#       # format: "{voltage:.1f} V  {current:.1f} A"   # INSTEAD of field: a line interpolating
#       #                      #   several fields of the message ({field} / {field:.Nf}); no unit /
#       #                      #   precision / thresholds on a format row — they live in the string
#       # precision: 1         # decimals (default: raw value)
#       # unit: V
#       # warn_below: 22.0     # threshold coloring; any subset of warn/err below/above
#       # warn_above: 27.0
#       # err_below: 20.0
#       # err_above: 28.0
