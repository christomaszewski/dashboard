# Dashboard instance config. rig cross-checks `service`/`name` against vehicle.yaml; dash-up reads
# the flat keys (tools/dash_env.py) to parameterize the compose stack, and bind-mounts THIS file
# into dashboard-web so the app itself can read `ws_port` and the `home:` layout at page load
# (served at /config/dashboard.yaml; edit + `docker compose restart dashboard-web` + refresh).
# Copy/edit per deployment.
service: dashboard
name: dashboard       # instance name -> compose project (rig requires it unique across the vehicle)
web_port: 8080        # http: the React bundle        -> http://<vehicle-ip>:<web_port>
ws_port: 10000        # remote-api websocket (zenoh-ts) -> ws://<vehicle-ip>:<ws_port>

# clouds_dir: /data/clouds   # optional: host dir of point-cloud files (.bpf) served read-only at
                             #   /clouds/ for the Clouds tab (relative paths resolve against this
                             #   config's directory). Omit -> the tab still works via drag & drop.

# ── Tabs (optional) ────────────────────────────────────────────────────────────────────────────
# Per-tab visibility; anything omitted is shown. Available: home, cameras, ros, clouds, debug.
# The Clouds tab is lazy-loaded (its three.js chunk only downloads when opened), so leaving it
# enabled costs nothing until used. A hidden tab's deep link falls back to the first visible tab.
#
# tabs:
#   debug: false      # e.g. hide the bus debugger in operator deployments
#   clouds: false

# ── Home tab (optional) ────────────────────────────────────────────────────────────────────────
# Lays out the project-specific Home: status pills, ROS2 service buttons, live video, topic
# readouts, grouped panels. Omit the whole block for the built-in default Home (connection +
# discovery summary). One malformed widget shows an inline error card and the rest still render.
# Every optional key below is shown commented with its default.
#
# home:
#   version: 1                 # schema major; unsupported -> banner + default Home
#   title: Mission Overview    # optional; also shown next to the topbar brand
#
#   # -- layout (optional): place widgets on a named 2-D grid --------------------------------------
#   # Draw the page as rows of area names ('.' = empty cell); each name must form a solid
#   # rectangle. Widgets pick a cell block with `area:`; widgets WITHOUT an area auto-flow into the
#   # remaining cells (their `span:` still applies; `span` is ignored when `area` is set). An
#   # invalid layout or unknown/duplicate area degrades to auto-flow with a warning banner — never
#   # a broken page. Narrow screens (<560px) collapse to one column. Omit `layout:` entirely for
#   # the flow-order grid.
#   layout:
#     columns: "2fr 1fr 1fr"   # optional grid-template-columns tracks (default: equal columns)
#     areas:
#       - "cams cams power"
#       - "cams cams nav"
#       - "ctrl ctrl  nav"
#
#   widgets:
#
#     # -- status: presence / rate indicator ----------------------------------------------------
#     - type: status
#       label: Front camera
#       source: stream         # stream | node | topic_hz
#       stream: cam0           # sensor id (last segment of fleet/*/media/<id>), descriptor id,
#                              #   or the full keyexpr
#
#     - type: status
#       label: Nav node
#       source: node
#       node: /navsat_transform    # fully-qualified node name (namespace included)
#
#     - type: status
#       label: IMU rate
#       source: topic_hz       # measured arrival rate on the topic's rmw_zenoh data keyexpr.
#       topic: /imu/data       #   NB: holds a live data subscription — the payload streams to the
#       min_hz: 90             #   browser. Prefer low-rate topics or accept the bandwidth.
#       # window_s: 5          # measurement window (default 5 s)
#
#     # -- service_button: call a ROS2 service over zenoh ---------------------------------------
#     # Type resolution is automatic: bundled schemas (std_srvs Trigger/SetBool/Empty, ...) or the
#     # serving node's ~/get_type_description for anything else — vendor types included.
#     - type: service_button
#       label: Start recording
#       service: /recorder/start
#       # srv_type: std_srvs/srv/Trigger   # optional cross-check against the live graph only
#       # request: {}          # request fields; omitted fields zero-fill
#       # confirm: false       # true = two-step click for destructive actions
#       # timeout_s: 5
#
#     # -- video: embedded live stream ----------------------------------------------------------
#     # Shares ONE WebRTC session (and one vehicle-side encode) with the Cameras tab.
#     - type: video
#       stream: cam0
#       area: cams             # optional: a layout.areas name (any widget type accepts area:)
#       # label:               # overlay label (default: the stream's role/id)
#       # span: 2              # grid cells when auto-flowing: 1 | 2 | full (video default 2)
#
#     # -- panel: grouped mini-widgets in one card ----------------------------------------------
#     # Items are readout shorthands (a `field:` with no `type:` — shown as name | value rows,
#     # inheriting the panel `topic:`) and/or full status / service_button / topic_value configs
#     # rendered compact. No video, no nested panels. A bad item is one red row; siblings render.
#     # NB: a full `type: topic_value` item does NOT inherit the panel topic — only shorthands do.
#     # All topic rows on one topic share a single bus subscription + decode.
#     - type: panel
#       title: GNSS            # optional header
#       area: nav
#       topic: /gnss/fix       # default topic for the readout shorthands below
#       items:
#         - field: latitude    # dot-path into the decoded message
#           name: Lat          # row label (default: the field path); `label:` also accepted
#           precision: 6
#         - field: status.satellites_used
#           name: Sats
#         - field: voltage
#           topic: /battery_state   # per-item topic override
#           name: Battery
#           unit: V
#           warn_below: 22.0
#         - type: status
#           label: Nav node
#           source: node
#           node: /navsat_transform
#         - type: service_button
#           label: Re-init
#           service: /gnss/reset
#
#     # -- lifecycle: standby/active control of a service (camera-service recording) --------------
#     # Drives the zenoh lifecycle control plane (camera-service docs/LIFECYCLE.md):
#     #   fleet/<vehicle>/svc/<instance>/lifecycle{,/change_state,/state}. Shows the live state,
#     # the current recording run + health, and one button per transition the service accepts
#     # right now. The Cameras tab also lists every advertised service with no config at all.
#     # Also allowed as a panel item (compact row).
#     - type: lifecycle
#       label: Front cam recorder
#       service: cam0            # <instance> (the CAM_INSTANCE segment) or <vehicle>/<instance>
#       # confirm: true          # two-step click before a transition
#       # run_id: survey         # sent with activate -> recording run prefix suffix
#
#     # -- map: live vehicle position -----------------------------------------------------------
#     # Marker + breadcrumb trail from a NavSatFix-style topic. TILES ARE FETCHED BY THE VIEWING
#     # BROWSER, never the vehicle: the OSM default just works on an internet-connected operator
#     # PC; a fully-offline operator PC can serve its own z/x/y tile tree (e.g. `python3 -m
#     # http.server 8000` in the tiles dir -> tiles: http://localhost:8000/{z}/{x}/{y}.png); a
#     # vehicle-hosted path works too. Unreachable tiles degrade to a plain background — the
#     # marker and trail always render.
#     - type: map
#       label: Position
#       topic: /gnss/fix
#       # lat_field: latitude     # dot-paths, for non-NavSatFix position sources
#       # lon_field: longitude
#       # tiles: https://tile.openstreetmap.org/{z}/{x}/{y}.png   # default; "none" disables tiles
#       # zoom: 17               # initial/follow zoom (2..22)
#       # trail: 500             # breadcrumb points kept (0 disables)
#       # follow: true           # keep the vehicle centered; panning pauses, ⌖ resumes
#       # attribution:           # set automatically for the OSM default
#       # span: 2                # (map default 2)
#
#     # -- gauge: arc gauge for a numeric field -------------------------------------------------
#     - type: gauge
#       label: Battery
#       topic: /battery_state
#       field: percentage
#       max: 100               # required
#       # min: 0
#       # unit: "%"
#       # precision: 0
#       # warn_below: 30 / err_below: 15 / warn_above / err_above   (arc color)
#
#     # -- sparkline: recent history of a numeric field ----------------------------------------
#     - type: sparkline
#       label: Speed
#       topic: /odom
#       field: twist.twist.linear.x
#       # window_s: 60         # history kept
#       # min: 0 / max: 5      # fixed y-range (autoscaled when omitted)
#       # unit: m/s
#       # precision: 1
#       # warn_above: 4 ...    # colors the line + value
#
#     # -- indicator: value -> colored state pill via rules ------------------------------------
#     # First rule whose conditions all hold wins (conditions: equals, not_equals, below, above,
#     # between: [lo, hi], in: [..], matches: <regex>); level: ok | warn | err | idle; `text`
#     # replaces the raw value. `default` applies when nothing matches (else idle).
#     - type: indicator
#       label: Armed
#       topic: /mavros/state
#       field: armed
#       rules:
#         - { equals: true,  level: ok,   text: ARMED }
#         - { equals: false, level: idle, text: disarmed }
#       # default: { level: warn, text: "?" }
#
#     # -- text: static operator notes ---------------------------------------------------------
#     - type: text
#       label: Radio
#       text: |
#         Ops channel 7. Call the tower before any lift.
#
#     # -- custom widgets: projects can add their own types (React, compiled into the image) ---
#     # See app/src/extensions/README.md — the shipped example is `type: example_compass`.
#
#     # -- topic_value: live single-field readout -----------------------------------------------
#     - type: topic_value
#       label: Battery
#       topic: /battery_state
#       field: voltage         # dot-path into the decoded message; numeric segments index arrays
#       # precision: 1         # decimals (default: raw value)
#       # unit: V
#       # warn_below: 22.0     # threshold coloring; any subset of warn/err below/above
#       # warn_above:
#       # err_below: 20.0
#       # err_above:
